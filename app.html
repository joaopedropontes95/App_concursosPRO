<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ConcursosPro</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fa;color:#172033}header{background:#111827;color:white;padding:22px 18px}main{max-width:900px;margin:auto;padding:18px}.hero,.card{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #00000010}.hero{background:linear-gradient(135deg,#111827,#334155);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#111827;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#e7ebf2;color:#172033}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:2px solid #e3e7ee;border-radius:12px;background:white;cursor:pointer}.option:hover{border-color:#64748b}.ok{border-color:#16a34a;background:#f0fdf4}.bad{border-color:#dc2626;background:#fef2f2}.muted{color:#667085}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#e8eefc;margin:3px;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}h1,h2{margin-top:0}small{opacity:.8}</style></head><body><header><main><b>ConcursosPro</b><h1>🎯 Estudar para TCESP 2026</h1><small>Treino adaptativo para Auditor de Controle Externo — DIPE</small></main></header><main><div class="nav"><button class="btn" onclick="show('home')">Início</button><button class="btn alt" onclick="show('study')">Questões</button><button class="btn alt" onclick="show('errors')">Meus erros</button><button class="btn alt" onclick="show('info')">Concurso</button></div><section id="home"></section><section id="study" hidden></section><section id="errors" hidden></section><section id="info" hidden></section></main><script>const data={exam:'TCESP 2026',date:'11/10/2026',general:['Língua Portuguesa','Raciocínio Lógico e Analítico','Ética Pública e Integridade','Legislação'],specialties:['Ciências Atuariais','Ciências Contábeis','Ciências Econômicas','Direito','Engenharia Civil','Tecnologia da Informação']};const qs=[['Direito','Controle externo e Tribunal de Contas','A função de fiscalização exercida pelos Tribunais de Contas integra o controle externo.','É correta a afirmação de que o Tribunal de Contas auxilia o Poder Legislativo no exercício do controle externo, sem integrar o Poder Judiciário.',['Verdadeiro','Falso'],'Verdadeiro'],['AFO','Orçamento público','Princípios orçamentários','O princípio da universalidade exige que todas as receitas e despesas constem da lei orçamentária.',['Verdadeiro','Falso'],'Verdadeiro'],['Língua Portuguesa','Interpretação','Coesão textual','A substituição de um termo por outro pronome, sem alterar o referente, pode preservar a coesão textual.',['Verdadeiro','Falso'],'Verdadeiro'],['Raciocínio Lógico','Proposições','Negação','A negação de uma proposição composta deve respeitar as regras lógicas de negação dos conectivos.',['Verdadeiro','Falso'],'Verdadeiro']];let idx=0,errors=JSON.parse(localStorage.getItem('cp_errors')||'[]'),answered=0;function hide(){['home','study','errors','info'].forEach(x=>document.getElementById(x).hidden=true)}function show(x){hide();document.getElementById(x).hidden=false;if(x==='home')home();if(x==='study')study();if(x==='errors')err();if(x==='info')info()}function home(){document.getElementById('home').innerHTML=`<div class=hero><h2>Seu treino adaptativo</h2><p>80 questões objetivas no edital. O app prioriza assuntos, desempenho e erros conforme você treina.</p><button class=btn onclick="show('study')">Começar questões</button></div><div class=card><h2>Progresso</h2><div class=grid><div><b>${answered}</b><br><span class=muted>respondidas nesta sessão</span></div><div><b>${errors.length}</b><br><span class=muted>erros no caderno</span></div><div><b>${data.date}</b><br><span class=muted>data da prova</span></div></div></div><div class=card><h2>Especialidades</h2>${data.specialties.map(x=>`<span class=tag>${x}</span>`).join('')}</div>`}function study(){let q=qs[idx%qs.length];document.getElementById('study').innerHTML=`<div class=card><span class=tag>${q[0]}</span><span class=tag>${q[1]}</span><h2>${q[2]}</h2><p>${q[3]}</p><div id=opts>${q[4].map((o,i)=>`<button class=option onclick="answer(${i})">${o}</button>`).join('')}</div><div id=feedback></div></div><div class=card><small>Questão ${idx+1} • Modo adaptativo</small></div>`}function answer(i){let q=qs[idx%qs.length],ok=q[4][i]===q[5];answered++;if(!ok){errors.push({assunto:q[2],question:q[3],answer:q[5]});localStorage.setItem('cp_errors',JSON.stringify(errors))}document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(q[4][n]===q[5])b.classList.add('ok');else if(n===i)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<div class=card><b>${ok?'✓ Correto':'✗ Incorreto'}</b><p>Comentário: a alternativa correta é <b>${q[5]}</b>. Revise o assunto e, se necessário, ele será priorizado no caderno de erros.</p><button class=btn onclick="idx++;study()">Próxima</button></div>`}function err(){document.getElementById('errors').innerHTML=`<div class=card><h2>📕 Meus erros</h2>${errors.length?errors.map((e,i)=>`<div class=card><b>${i+1}. ${e.assunto}</b><p>${e.question}</p><small>Resposta: ${e.answer}</small></div>`).join(''):'<p class=muted>Nenhum erro registrado ainda. Continue treinando.</p>'}</div>`}function info(){document.getElementById('info').innerHTML=`<div class=card><h2>TCESP 2026</h2><p><b>Edital:</b> 001/2026 • <b>Banca:</b> VUNESP</p><p><b>Cargo:</b> Auditor de Controle Externo — DIPE</p><p><b>Vagas:</b> 50 • <b>Inicial:</b> R$ 20.940,20 • <b>Prova:</b> 11/10/2026</p><p><b>Objetiva:</b> 80 questões. Conhecimentos gerais: ${data.general.join(', ')}.</p><p><b>Especialidades:</b> ${data.specialties.join(', ')}.</p><p><b>Etapa escrita:</b> estudo de caso relacionado à especialidade.</p><p class=muted>Dados estruturais obtidos de fontes oficiais; a distribuição fina por tópicos deve ser validada no edital integral e retificações.</p><p><a href="https://www.tce.sp.gov.br/6524-tcesp-abre-concurso-publico-para-auditor-controle-externo-com-oferta-50-vagas" target="_blank">Fonte oficial do TCESP</a> • <a href="https://www.tce.sp.gov.br/concursos" target="_blank">Página de concursos</a></p></div>`}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');show('home');</script></body></html>
