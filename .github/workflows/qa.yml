name: QA ConcursosPro

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install
      - name: Install Chromium and WebKit
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium webkit && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Browser install failed; retrying in 10s (attempt $attempt/3)..."
            sleep 10
          done
      - name: Run full end-to-end QA
        run: npm run qa
      - name: Run v19 Android and iPad regressions
        run: npx playwright test --config=playwright.v19.config.js
      - name: Run v20 answer-quality and TCESP regressions
        run: npx playwright test --config=playwright.v20.config.js
      - name: Run v21 grounded-explanation regressions
        run: npx playwright test --config=playwright.v21.config.js
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: |
            v20-report.json
            test-results
          if-no-files-found: ignore
          retention-days: 3
