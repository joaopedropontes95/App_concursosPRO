name: QA ConcursosPro

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install
      - name: Verify bundled browsers
        run: npx playwright --version
      - name: Run full end-to-end QA
        run: npm run qa
      - name: Run v19 Android and iPad regressions
        run: npx playwright test --config=playwright.v19.config.js
      - name: Run v20 answer-quality and TCESP regressions
        run: npx playwright test --config=playwright.v20.config.js
      - name: Run v21 grounded-explanation regressions
        run: npx playwright test --config=playwright.v21.config.js
      - name: Run v22 navigation, cross-filter and realism regressions
        run: npx playwright test --config=playwright.v22.config.js
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: |
            v20-report.json
            test-results
          if-no-files-found: ignore
          retention-days: 3
