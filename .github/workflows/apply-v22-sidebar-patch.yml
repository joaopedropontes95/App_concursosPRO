name: Apply v22 sidebar source patch

on:
  push:
    branches: [feature/ui-filters-question-realism-v22]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-filters-question-realism-v22
      - name: Remove legacy TCESP sidebar button from source HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          text=p.read_text()
          old='<button data-view="tcesp">🎯 TCESP 26</button>'
          if old in text:
              text=text.replace(old,'',1)
              p.write_text(text)
          elif 'data-view="tcesp"' in text:
              raise SystemExit('TCESP sidebar markup changed unexpectedly; refusing blind patch')
          PY
      - name: Commit source patch if needed
        run: |
          if git diff --quiet -- app.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'feat: remove legacy TCESP sidebar shortcut'
          git push origin HEAD:feature/ui-filters-question-realism-v22
