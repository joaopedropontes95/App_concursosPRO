name: Apply v22 QA expectation patch

on:
  push:
    branches: [feature/ui-filters-question-realism-v22]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-filters-question-realism-v22
      - name: Update baseline QA expectations for v22
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/app.spec.js')
          t=p.read_text()
          t=t.replace("['Início', 'TCESP 2026', 'Questões', 'Meus erros', 'Minhas trilhas', 'Fontes', 'Dados']", "['Início', 'Questões', 'Meus erros', 'Minhas trilhas', 'Fontes', 'Dados']")
          t=t.replace("caches.open('concursospro-v20')", "caches.open('concursospro-v22')")
          p.write_text(t)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- tests/app.spec.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/app.spec.js
          git commit -m 'test: align baseline QA with v22 navigation and cache'
          git push origin HEAD:feature/ui-filters-question-realism-v22
