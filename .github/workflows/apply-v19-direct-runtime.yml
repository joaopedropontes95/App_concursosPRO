name: Apply v19 direct runtime bootstrap

on:
  push:
    branches: [feature/direct-runtime-tcu-mock-v19]

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direct-runtime-tcu-mock-v19
      - name: Add direct runtimes to app.html once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          text=p.read_text()
          marker='data-cp-runtime-bootstrap="v19"'
          if marker not in text:
              tags='''\n<!-- data-cp-runtime-bootstrap="v19"; app-stability.js?b=18 compatibility marker prevents legacy SW v18 reinjection -->\n<script data-cp-runtime="v19" src="./data/tcesp-runtime.js"></script>\n<script data-cp-runtime="v19" src="./data/bank-loader-v2.js"></script>\n<script data-cp-runtime="v19" src="./data/trilhas-runtime.js?b=19"></script>\n<script data-cp-runtime="v19" src="./data/adaptive-engine.js"></script>\n<script data-cp-runtime="v19" src="./data/discursive-engine.js"></script>\n<script data-cp-runtime="v19" src="./data/performance-dashboard.js"></script>\n<script data-cp-runtime="v19" src="./data/answer-flow-guard.js?b=19"></script>\n<script data-cp-runtime="v19" src="./data/app-stability.js?b=19"></script>\n'''
              if '</body>' not in text:
                  raise SystemExit('app.html sem </body>')
              p.write_text(text.replace('</body>', tags+'</body>', 1))
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- app.html; then
            echo 'app.html already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'feat: load app runtimes directly without service worker'
          git push origin HEAD:feature/direct-runtime-tcu-mock-v19
